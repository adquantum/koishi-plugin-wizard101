name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON: /usr/bin/python3
      WIZARD101_TEST_PYTHON: /usr/bin/python3
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install CJK font and offline import test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk python3-pil
      - name: Check syntax
        run: npm run check
      - name: Check Python importers
        run: python3 -m py_compile tools/icons/import.py tools/catalog/from-sqlite.py
      - name: Run offline and synthetic HTTP tests
        run: npm test
      - name: Check public package contents
        run: npm run check:public
